services:
  api:
    image: insurance-core-api:latest
    container_name: insurance-core-api
    env_file:
      - ../.env
    environment:
      SMTP_HOST: maildev
      SMTP_PORT: 1025
      SMTP_ENCRYPTION: none
      SMTP_FROM_EMAIL: no-reply@insurance.local
      SMTP_FROM_NAME: Insurance Core
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      maildev:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    container_name: insurance-core-postgres
    environment:
      POSTGRES_DB: insurance_core
      POSTGRES_USER: insurance
      POSTGRES_PASSWORD: insurance
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insurance -d insurance_core"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  maildev:
    image: maildev/maildev:2.1.0
    container_name: insurance-core-maildev
    ports:
      - "1025:1025"
      - "1080:1080"
    restart: unless-stopped

volumes:
  postgres_data:
